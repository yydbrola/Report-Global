# Configuração do pipeline de curadoria de notícias internacionais (Visão Global)

user_agent: "VisaoGlobalPipeline/1.0 (uso editorial local; robots respeitado)"

# Endpoint base parametrizado para facilitar migração futura de provedor
# (JEV usa <base>/alpha/decisions; chat usa <base>/v1/chat/completions)
# Migre alterando este valor apenas.
openrouter:
  endpoint_base: "https://openrouter.ai/api"

jev:
  modelo: "typesafe/jev-1.13"
  tentativas: 5
  backoff_base_seg: 1.0
  backoff_max_seg: 30.0

sumario:
  ativo: true
  # política: apenas modelos gratuitos (decisão do usuário, 22/10/2026).
  # minimax/minimax-m3.1-flash:free foi aposentado pelo OpenRouter em 22/10/2026.
  modelo: "nvidia/nemotron-3-ultra-550b-a55b:free"
  tentativas: 5
  max_caracteres_texto_base: 80

editorial:
  ativo: true
  motor: "directo"          # smolagents | directo (smolagents instável c/ Nemotron)
  modelo: "nvidia/nemotron-3.5-super-vl:free"   # 1M ctx; reasoning desativado no payload
  max_tokens: 4500          # teto explicito (payload do modo directo)
  max_passos: 8
  titulo_capa_fallback: "O MUNDO EM\nMOVIMENTO"
  subtitulo_capa_fallback: "Sinais diplomáticos, riscos estratégicos e os temas que moldam a agenda internacional."

email:
  destino: ""                   # preferir a variável de ambiente EMAIL_DESTINO
  modo: draft                   # draft | send
  client_secret: "client_secret.json"
  arquivo_credenciais: "gmail_token.json"

# Radar de tendências: interesse de busca no YouTube (Trends API, trendsapi.ai)
# A chave vive em TRENDSAPI_KEY (env). Free tier: 100 req/mês, séries de 90 dias.
youtube_trends:
  geo: "BR"                      # registro: o endpoint do YouTube não aceita regionCode
  termos_de_interesse: ["geopolítica", "conflito", "sanções", "eleições", "economia"]
  atualizar_historico_dias: 7    # cache da série por termo
  top_trends_ttl_horas: 24       # cache do feed ao vivo
  limite_top_trends: 10
  janela_variacao_dias: 30       # exibida como "vs. 30 dias"

# Busca dinâmica de vídeos: cada termo com status 'alta' no Radar dispara
# ytsearch{n} no YouTube (yt-dlp) e a transcrição vira o corpo do artigo.
youtube_busca:
  max_videos_total: 8            # teto global por execução (custo/tamanho do PDF)
  top_n_videos: 3                # quantos vídeos por termo em alta
  min_views: 1000                # descarta vídeos com poucas visualizações
  dias_retroativos: 2            # só vídeos publicados nos últimos N dias

cache:
  ativo: true
  ttl_dias: 7

limites:
  max_artigos_por_fonte: 25
  max_artigos_total: 60
  delay_segundos: 2.5
  truncar_chars: 6000

