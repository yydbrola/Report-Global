# Categorias temáticas na ORDEM em que aparecem no PDF.
# criterio_jev em inglês: são as descrições enviadas ao modelo JEV.
# Taxonomia MECE — Mutually Exclusive, Collectively Exhaustive.
categorias:
  conflitos_guerras:
    nome: "Conflitos e Guerras"
    rotulo: "CONFLITOS"
    criterio_jev: "Active armed conflicts, wars, military invasions, terrorism, rebel groups, and violent civil unrest. Focus on physical violence and combat."
  diplomacia_negociacoes:
    nome: "Diplomacia e Negociações"
    rotulo: "DIPLOMACIA"
    criterio_jev: "Bilateral or multilateral talks, peace negotiations, state visits, treaties, diplomatic expulsions, and summits aimed at resolving disputes."
  economia_comercio:
    nome: "Economia e Comércio"
    rotulo: "ECONOMIA"
    criterio_jev: "International trade deals, tariffs, economic sanctions, global markets, supply chains, energy crises, and cross-border financial policies."
  seguranca_defesa:
    nome: "Segurança e Defesa"
    rotulo: "DEFESA"
    criterio_jev: "Military alliances (like NATO), defense budgets, arms races, weapons deals, cybersecurity, espionage, and intelligence operations."
  organizacoes_multilaterais:
    nome: "Organizações Multilaterais"
    rotulo: "MULTILATERAL"
    criterio_jev: "Activities of the UN, EU, BRICS, G7, WTO, WHO, and global governance summits. Focus on institutional actions rather than bilateral talks."
  direitos_humanos_migracao:
    nome: "Direitos Humanos e Migração"
    rotulo: "DIREITOS HUMANOS"
    criterio_jev: "Refugee crises, asylum policies, human rights violations, humanitarian aid, international law regarding civilians, and social justice."
  meio_ambiente_clima:
    nome: "Meio Ambiente e Clima"
    rotulo: "CLIMA"
    criterio_jev: "Climate change summits (COP), international environmental treaties, carbon emissions, cross-border natural disasters, and green energy policies."
  tecnologia_ciberespaco:
    nome: "Tecnologia e Ciberespaço"
    rotulo: "TECNOLOGIA"
    criterio_jev: "AI regulations, semiconductor supply chains, space exploration, tech decoupling (US vs China), cyber warfare, and digital privacy."
  politica_domestica_global:
    nome: "Política Doméstica com Impacto Global"
    rotulo: "POLÍTICA DOMÉSTICA"
    criterio_jev: "Major elections in key countries, domestic protests affecting foreign policy, internal political crises, and leadership changes with international spillover."
  outros:
    nome: "Outros"
    rotulo: "GERAL"
    criterio_jev: "Articles that do not clearly fit into any of the specific categories above, such as cultural exchanges, sports, or miscellaneous news."
